<!-- about.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a2e;
      padding: 0.9rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    nav .brand {
      color: #fff;
      font-weight: 700;
      font-size: 1.1rem;
      text-decoration: none;
    }
    nav .links {
      display: flex;
      gap: 0.5rem;
    }
    nav a.link {
      position: relative;
      color: #cfcfe8;
      text-decoration: none;
      font-weight: 600;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a.link:hover {
      color: #fff;
      background: rgba(255,255,255,0.08);
    }
    nav a.link.active {
      color: #fff;
      background: #16213e;
    }
    nav a.link.active::after {
      content: "";
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: -1px;
      height: 2px;
      background: #4f8cff;
      border-radius: 2px;
    }
    main { padding: 2rem; }

    @media (max-width: 480px) {
      nav { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      nav .links { width: 100%; justify-content: space-around; }
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">MySite</a>
    <div class="links">
      <a href="index.html" class="link">Home</a>
      <a href="about.html" class="link active">About</a>
    </div>
  </nav>
  <main>
    <h1>About</h1>
    <p>This is the about page.</p>
  </main>
</body>
</html>
