<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; color: #1a1a2e; }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1a1a2e;
      padding: 0.9rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    nav .brand { color: #fff; font-weight: 700; font-size: 1.1rem; text-decoration: none; }
    nav .links { display: flex; gap: 0.5rem; }
    nav a.link {
      position: relative;
      color: #cfcfe8;
      text-decoration: none;
      font-weight: 600;
      padding: 0.5rem 0.9rem;
      border-radius: 6px;
      transition: color 0.2s ease, background 0.2s ease;
    }
    nav a.link:hover { color: #fff; background: rgba(255,255,255,0.08); }
    nav a.link.active { color: #fff; background: #16213e; }
    nav a.link.active::after {
      content: "";
      position: absolute;
      left: 10px; right: 10px; bottom: -1px;
      height: 2px; background: #4f8cff; border-radius: 2px;
    }
    @media (max-width: 480px) {
      nav { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
      nav .links { width: 100%; justify-content: space-around; }
    }

    /* Hero */
    .hero {
      background: linear-gradient(135deg, #16213e, #1a1a2e);
      color: #fff;
      padding: 5rem 1.5rem;
      text-align: center;
    }
    .hero h1 { font-size: 2.5rem; margin: 0 0 0.75rem; }
    .hero p { font-size: 1.1rem; color: #cfcfe8; max-width: 500px; margin: 0 auto 1.5rem; }
    .hero .cta {
      display: inline-block;
      background: #4f8cff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      padding: 0.75rem 1.75rem;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .hero .cta:hover { background: #3d75e0; transform: translateY(-2px); }

    /* Feature grid */
    .features {
      max-width: 960px;
      margin: 0 auto;
      padding: 3.5rem 1.5rem;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
    }
    .card {
      background: #f7f8fc;
      border: 1px solid #e6e8f0;
      border-radius: 10px;
      padding: 1.5rem;
      text-align: left;
    }
    .card .icon { font-size: 1.6rem; margin-bottom: 0.5rem; }
    .card h3 { margin: 0 0 0.4rem; font-size: 1.05rem; }
    .card p { margin: 0; color: #55597a; font-size: 0.95rem; line-height: 1.5; }

    @media (max-width: 700px) {
      .features { grid-template-columns: 1fr; }
      .hero h1 { font-size: 2rem; }
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: #8a8fb5;
      font-size: 0.85rem;
      border-top: 1px solid #e6e8f0;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="brand">MySite</a>
    <div class="links">
      <a href="index.html" class="link active">Home</a>
      <a href="about.html" class="link">About</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Welcome to MySite</h1>
    <p>A clean, simple starting point for your next project.</p>
    <a href="about.html" class="cta">Learn More</a>
  </section>
